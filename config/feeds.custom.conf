# feeds.custom.conf — 本仓库自定义 feed（build-mine.sh / CI 追加到官方 feeds.conf.default 之后）
# 2026-10-21 架构转向：保留 src-link 形态；packages-xr1710g/ 由本地补丁 9603 在源码树中创建。
# ------------------------------------------------------------------
# ⚠ 坑（2026-10-22 CI 实测）：openwrt 的 scripts/feeds 剥注释用 `s/#.+$//`——
#   `#` 后面必须有内容才算注释！**裸 `#` 行会被当有效行**，继而因不匹配
#   `src-*` 直接 "Syntax error in feeds.conf, line N"。分隔行必须写成
#   `# ---` 这类带内容的形态，勿用裸 `#`。
# ------------------------------------------------------------------
# 注意 1：scripts/feeds 用 `ln -s <path> feeds/<name>` 创建原文链接——相对路径从 feeds/ 目录解析！
#         指向 TOPDIR 下目录必须写 `../<path>`（默认 base feed 也是 ../package）。
# 注意 2：src-link 的 path 须直接包含各包目录（<feedroot>/<pkg>/Makefile），
#         本仓库包在 packages-xr1710g/package/ 下。

src-link xr1710g ../packages-xr1710g/package

