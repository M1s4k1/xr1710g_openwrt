name: sync-upstream

# 决策：2h 自动同步上游 + 补丁层 dry-run 校验（借鉴 fanboy 每 2h rebase 模型；
# 补丁层冲突面越小越好——同步越勤，冲突越少。冲突=CI 红，处理=修补丁层，不降级。）

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      # F151：守护脚本自身/工作流改动也要触发——改完守卫必须立刻自证（原来逐条列脚本名，
      # 改 audit-upstream-watch.sh 不触发，等于改了守卫不跑守卫）
      - 'scripts/**'
      - '.github/workflows/sync-upstream.yml'
      - 'config/**'
      - 'files/**'

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 克隆最新 openwrt master 并叠加本仓库
        run: |
          git clone -q --depth 1 https://github.com/openwrt/openwrt.git openwrt
          rsync -a --exclude='.git' --exclude='audit-ubi2oc' --exclude='.github' --exclude='openwrt' \
            "$GITHUB_WORKSPACE/" openwrt/
          cd openwrt
          chmod +x scripts/*.sh

      - name: 上游基线守护（重基预警，只读）
        run: |
          cd openwrt
          # 2026-09-11：本仓多个补丁的内层基线是上游具体文件（如 9041/9033 依赖
          # generic/pending-6.18/742|743 的旧版上下文）。上游改这些文件不会立刻让 dry-run 红，
          # 却会在构建期才失败（典型：PR #25092 改 742/743 并新增 744/745）。用 blob SHA
          # 精确比对 → 漂移即预警，并点出需重基的本仓补丁。
          # F151：新增「本仓新增文件 × 上游同址」自动扫描（9042/182 实证），并把远端 fork
          # tip 前进降为 ⚠ 不计失败——它长期常红，反倒让下面的 dry-run 硬门被跳过。
          ./scripts/audit-upstream-watch.sh . --fail-on-drift

      - name: 补丁层 dry-run（默认 + OC + 实验档）
        # F151：`!cancelled()` —— 守护步骤即使红，这一条也必须跑：它才是拦住补丁链的硬门。
        if: ${{ !cancelled() }}
        run: |
          cd openwrt
          # F25（2026-08-18）：加 --experimental——实验档补丁同样需要 2h 漂移检测，
          # 否则 #EXP 条目只在手动构建时才暴露上下文漂移（F20/F21/F23 盲区同型）
          ./scripts/apply-patches.sh . --dry-run --oc --experimental
          echo "上游 HEAD: $(git rev-parse --short HEAD)"

      - name: OC 脚本语法与档位自检
        run: |
          cd openwrt
          bash -n scripts/prepare-oc.sh && echo "prepare-oc.sh 语法 OK"
          bash -n scripts/build.sh && echo "build.sh 语法 OK"