name: build

# XR1710G 固件构建（GitHub Actions）
#
# 为什么走 CI：全量构建 1–3 小时且吃满 CPU，用 CI 避免占用本地机器；
#   CI 每次全新环境，配合 ccache 重复构建显著加速。
#
# 仓库定位（2026-10-21 架构转向后）：以 OpenWrt 主线为基座，本仓库只带差异。
#   CI 组合两份物料：① 本仓库（local/ 补丁集 + config/）；② OpenWrt 源码树（pin 到
#   config/source-lock.env 的 OPENWRT_REF）。
#   流程：clone openwrt@pin → apply-patches 应用本地补丁集 → audit → 编译 .itb → 上传产物。

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '档位：func=正式档 / v1-safe=保守档（首次刷机建议）'
        default: 'v1-safe'
        required: true
        type: choice
        options:
          - func
          - v1-safe
      openwrt_ref:
        description: 'OpenWrt 源码树 ref（默认 = source-lock.env 的 pin，Linux 6.18.44 基线快照）'
        default: '63f702f1c0cebe2587aac10b63a02e964fc2a558'
        required: true
      create_release:
        description: '构建成功后是否自动创建 GitHub Release'
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PROFILE: ${{ github.event.inputs.profile || 'v1-safe' }}
      TREE: ${{ github.workspace }}/openwrt
    steps:
      - name: 清理磁盘空间（释放 ~35GB 冗余预装套件）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: 取出本仓库（叠加层）
        uses: actions/checkout@v4
        with:
          path: mine

      - name: 克隆 OpenWrt 源码树（pin ref）
        run: |
          set -euo pipefail
          git clone https://github.com/openwrt/openwrt.git "$TREE"
          cd "$TREE"
          git checkout -q "${{ github.event.inputs.openwrt_ref || '63f702f1c0cebe2587aac10b63a02e964fc2a558' }}"
          echo "OpenWrt commit: $(git rev-parse --short HEAD)"
          # 内核版本硬门禁：锁定 6.18.55（与 source-lock.env 一致）
          if grep -q 'LINUX_VERSION-6.18.*=.*\.55' target/linux/generic/kernel-6.18 2>/dev/null; then
            echo "✓ 内核版本验证通过：Linux 6.18.55"
          else
            echo "::error::当前 OpenWrt 树内核版本非 6.18.55，构建补丁集必将失败！请检查 openwrt_ref！"
            grep 'LINUX_VERSION-6.18' target/linux/generic/kernel-6.18 2>/dev/null || true
            exit 1
          fi

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: ccache 缓存配置
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: openwrt-${{ env.PROFILE }}
          restore-keys: openwrt-${{ env.PROFILE }}
          max-size: 3G

      - name: 仓库自检 (audit-local)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/mine"
          bash scripts/audit-local.sh

      - name: 应用本地补丁集（apply-patches）
        run: |
          set -euo pipefail
          export LC_ALL=C LANG=C
          bash "$GITHUB_WORKSPACE/mine/scripts/apply-patches.sh" \
            --tree "$TREE" --tier "$PROFILE"

      - name: 配置 ccache 到构建流程
        run: |
          set -euo pipefail
          # 在 make 之前注入 CONFIG_CCACHE=y
          cd "$TREE"
          cp -f feeds.conf.default feeds.conf
          cat "$GITHUB_WORKSPACE/mine/config/feeds.custom.conf" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          cat "$GITHUB_WORKSPACE/mine/local/seed.local.diff" >> .config
          make defconfig
          echo 'CONFIG_CCACHE=y' >> .config
          echo "CONFIG_CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"" >> .config

      - name: 执行固件构建 (make)
        run: |
          set -euo pipefail
          export LC_ALL=C LANG=C
          cd "$TREE"
          JOBS="$(nproc)" make -j"$JOBS" V=s CONFIG_VERSION_DIST="OpenWrt $PROFILE" 2>&1 | tee "$GITHUB_WORKSPACE/build-$PROFILE.log"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ env.PROFILE }}
          path: build-${{ env.PROFILE }}.log

      - name: 上传固件产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PROFILE }}
          if-no-files-found: error
          path: |
            ${{ env.TREE }}/bin/targets/airoha/an7581/*.itb
            ${{ env.TREE }}/bin/targets/airoha/an7581/*.manifest
            !${{ env.TREE }}/bin/targets/airoha/an7581/*-factory*

  release:
    if: (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true) && success()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载固件产物
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.profile || 'v1-safe' }}
          path: _firmware

      - name: 打包固件压缩包
        run: |
          set -euo pipefail
          tar -czvf "xr1710g-firmware-${{ github.event.inputs.profile || 'v1-safe' }}.tar.gz" -C _firmware .

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: "XR1710G 固件构建 #${{ github.run_number }} (${{ github.event.inputs.profile || 'v1-safe' }})"
          body: |
            ### 构建信息
            - **档位 (Profile)**: `${{ github.event.inputs.profile || 'v1-safe' }}`
            - **基座**: OpenWrt main @ `${{ github.event.inputs.openwrt_ref || '63f702f1c' }}`（Linux 6.18.55）
            - **架构**: OpenWrt 主线为基座 + 本地补丁集（2026-10-21 转向；aggregate 已退役为参考）
            - **网口映射**: 10G-1=WAN(eth1), 10G-2=LAN(eth2), 1G-1=LAN(lan2), 1G-2=LAN(lan3)
            - **默认 LAN IP**: `192.168.2.1`
            - **注意**: NPU offload 栈尚未移植（Phase 2）——本版本不含硬件卸载能力
          files: xr1710g-firmware-*.tar.gz
          make_latest: true
          prerelease: false
